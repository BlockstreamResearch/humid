name: Deploy Storybook

# ⚠️ TEMPORARILY DISABLED — GitHub Pages is not enabled for this repo yet
# (Settings → Pages → Source: GitHub Actions). The automatic `push` trigger is
# commented out so the workflow no longer runs (and no longer fails) on every
# push to master.
#
# To re-enable: uncomment the `push` block below, then enable Pages.
on:
  # push:
  #   branches: [master]
  # Left as the only trigger while disabled — nothing runs automatically; the
  # workflow can still be started manually from the Actions tab if needed.
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments; let an in-progress run finish instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Hard guarantee: never run for any ref other than master (covers
    # workflow_dispatch triggered from another branch).
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Storybook
        run: bun run build-storybook

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
