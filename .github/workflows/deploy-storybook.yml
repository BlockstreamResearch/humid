name: Deploy Storybook

# ⚠️ TEMPORARILY DISABLED — GitHub Pages is not enabled for this repo yet
# (Settings → Pages → Source: GitHub Actions). The automatic `push` trigger is
# commented out so the workflow no longer runs (and no longer fails) on every
# push to master.
#
# To re-enable: uncomment the `push` block below, then enable Pages.
on:
  # push:
  #   branches: [master]
  # Left as the only trigger while disabled — nothing runs automatically; the
  # workflow can still be started manually from the Actions tab if needed.
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments; let an in-progress run finish instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Hard guarantee: never run for any ref other than master (covers
    # workflow_dispatch triggered from another branch).
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # This checkout has no submodules and Storybook imports neither wasm package, so the
      # two local `file:` dependencies are given a package at their path rather than built.
      # Without one at `smplx/crates/wasm/pkg`, `bun install` cannot resolve the workspace.
      - name: Prepare unused wasm dependencies
        run: |
          mkdir -p lwk/lwk_wasm/pkg smplx/crates/wasm/pkg
          printf '{"name":"lwk_wasm","version":"0.0.0","type":"module"}\n' > lwk/lwk_wasm/pkg/package.json
          printf '{"name":"smplx-wasm","version":"0.0.0","type":"module"}\n' > smplx/crates/wasm/pkg/package.json

      - name: Install dependencies
        uses: ./.github/actions/install
        with:
          cache: "false"

      - name: Build Storybook
        run: bun run build-storybook

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
