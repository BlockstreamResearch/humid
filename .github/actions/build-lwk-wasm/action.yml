name: Build lwk_wasm
description: >-
  Build the lwk_wasm WASM package from the vendored `lwk` git submodule so the
  `file:lwk/lwk_wasm/pkg` dependency resolves. `lwk_wasm/pkg` is a wasm-pack build
  artifact that is not committed, so it must be produced in CI. The output is cached by
  the pinned submodule commit, build profile and simplicity feature. Requires the repo
  to be checked out with `submodules: recursive`.

inputs:
  cache:
    description: >-
      Set to "false" to skip the cache and build from source. Release and deploy jobs
      do this, so nothing they ship comes from a cache.
    default: "true"
  profile:
    description: "wasm-pack profile: `release` (optimized, small wasm) or `dev` (fast, large wasm)."
    default: release

runs:
  using: composite
  steps:
    - name: Resolve pinned lwk commit
      id: lwk
      shell: bash
      run: echo "sha=$(git rev-parse HEAD:lwk)" >> "$GITHUB_OUTPUT"

    - name: Restore built lwk_wasm/pkg
      id: pkg-cache
      if: inputs.cache == 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: lwk/lwk_wasm/pkg
        key: lwk-wasm-${{ runner.os }}-${{ steps.lwk.outputs.sha }}-${{ inputs.profile }}-simplicity

    - name: Install Rust toolchain (1.85.0 + wasm32)
      if: steps.pkg-cache.outputs.cache-hit != 'true'
      uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
      with:
        toolchain: "1.85.0"
        targets: wasm32-unknown-unknown

    - name: Restore cargo registry + build
      id: cargo-cache
      if: inputs.cache == 'true' && steps.pkg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          lwk/target
        key: cargo-${{ runner.os }}-${{ steps.lwk.outputs.sha }}
        restore-keys: |
          cargo-${{ runner.os }}-

    - name: Install wasm-pack
      if: steps.pkg-cache.outputs.cache-hit != 'true'
      uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
      with:
        tool: wasm-pack@0.14.0

    - name: Build lwk_wasm (wasm-pack, target bundler)
      if: steps.pkg-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: lwk/lwk_wasm
      run: wasm-pack build --${{ inputs.profile }} --features simplicity

    - name: Save cargo registry + build
      if: inputs.cache == 'true' && steps.pkg-cache.outputs.cache-hit != 'true' && steps.cargo-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          lwk/target
        key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

    - name: Save built lwk_wasm/pkg
      if: inputs.cache == 'true' && steps.pkg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: lwk/lwk_wasm/pkg
        key: ${{ steps.pkg-cache.outputs.cache-primary-key }}
